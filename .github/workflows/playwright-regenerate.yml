name: Playwright Regenerate Linux

# Manual invocation: regenerates Linux baselines for the dispatched branch
# and opens an auto-PR with the resulting *-linux.png files.
#
# Invoke:
#   gh workflow run playwright-regenerate.yml --ref <branch> -f target=all
#
# After completion, review the auto-PR's visual diff before merging.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Spec scope (e.g. e2e/m0.15-redesign/ or all)'
        required: true
        default: all

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    name: Regenerate Playwright baselines on Linux
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium browser
        run: pnpm --filter @claude-loom/ui exec playwright install chromium --with-deps

      - name: Regenerate snapshots
        run: |
          if [ "${{ inputs.target }}" = "all" ]; then
            pnpm --filter @claude-loom/ui exec playwright test \
              --config e2e/playwright.config.ts \
              --update-snapshots=all
          else
            pnpm --filter @claude-loom/ui exec playwright test \
              --config e2e/playwright.config.ts \
              "${{ inputs.target }}" \
              --update-snapshots=all
          fi

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet ui/e2e/__screenshots__/; then
            echo "has-changes=false" >> $GITHUB_OUTPUT
          else
            echo "has-changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create PR
        if: steps.changes.outputs.has-changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="chore/playwright-linux-baseline-$(date +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add ui/e2e/__screenshots__/
          git commit -m "chore(e2e): regenerate Linux baseline snapshots [playwright-baseline-regenerate]"
          git push origin "$BRANCH"
          BASE_BRANCH="${{ github.ref_name }}"
          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$BRANCH" \
            --title "chore(e2e): regenerate Linux baselines (auto-PR into $BASE_BRANCH)" \
            --body "Auto-generated by playwright-regenerate workflow on $(date -u +%Y-%m-%dT%H:%M:%SZ). Triggered by workflow_dispatch on commit ${{ github.sha }}. Review the *-linux.png visual diff before merging."
